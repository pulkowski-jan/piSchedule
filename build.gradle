import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.file.DuplicatesStrategy
import org.gradle.api.tasks.wrapper.Wrapper
import java.util.jar.JarFile

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'org.pischedule'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Build on the desktop but compile against the supported Pi runtime baseline.
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'org.pischedule.Main'
}

dependencies {
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.apache.commons:commons-csv:1.11.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.3'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

// Preserve each dependency's bundled license and notice files under its own name.
tasks.register('collectDependencyNotices', Sync) {
    into layout.buildDirectory.dir('dependency-notices')
    configurations.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }.each { dependency ->
        from(zipTree(dependency)) {
            include 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/COPYING*'
            include 'LICENSE*', 'NOTICE*', 'COPYING*'
            into dependency.name
        }
    }
}

// Keep native SQLite resources and merge Java service providers into the runnable JAR.
tasks.named('shadowJar', ShadowJar) {
    dependsOn tasks.named('collectDependencyNotices')
    from(tasks.named('collectDependencyNotices')) {
        into 'META-INF/third-party'
    }
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    manifest {
        attributes 'Main-Class': 'org.pischedule.Main', 'Multi-Release': 'true'
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

// Check the built artifact as well as the ordinary unit tests. Native execution
// on the 64-bit Pi must still be tested on the actual device.
tasks.register('verifyBundledJar') {
    dependsOn tasks.named('shadowJar')
    def bundledJar = tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile }
    inputs.file(bundledJar)
    doLast {
        new JarFile(bundledJar.get().asFile).withCloseable { jar ->
            ['META-INF/services/java.sql.Driver',
             'META-INF/services/org.slf4j.spi.SLF4JServiceProvider',
             'org/sqlite/native/Linux/aarch64/libsqlitejdbc.so'].each { name ->
                if (jar.getEntry(name) == null) throw new GradleException("Bundled JAR is missing ${name}")
            }
            if (jar.manifest?.mainAttributes?.getValue('Main-Class') != 'org.pischedule.Main') {
                throw new GradleException('Bundled JAR has no application entry point')
            }
            if (jar.manifest?.mainAttributes?.getValue('Multi-Release') != 'true') {
                throw new GradleException('Bundled JAR is missing its multi-release manifest flag')
            }
            def jdbc = jar.getInputStream(jar.getEntry('META-INF/services/java.sql.Driver')).getText('UTF-8')
            if (!jdbc.readLines().contains('org.sqlite.JDBC')) {
                throw new GradleException('Bundled JAR is missing its SQLite JDBC service provider')
            }
            def logging = jar.getInputStream(jar.getEntry('META-INF/services/org.slf4j.spi.SLF4JServiceProvider')).getText('UTF-8')
            if (!logging.readLines().contains('org.slf4j.nop.NOPServiceProvider')) {
                throw new GradleException('Bundled JAR is missing its SLF4J provider')
            }
        }
    }
}

// Exercise SQLite from the shaded JAR on the build host, independently of the
// ordinary test runtime classpath. ARM64 still needs its own device test.
tasks.register('smokeTestBundledJar', JavaExec) {
    dependsOn tasks.named('shadowJar'), tasks.named('testClasses')
    classpath = files(tasks.named('shadowJar', ShadowJar).flatMap { it.archiveFile },
            sourceSets.test.output.classesDirs)
    mainClass = 'org.pischedule.packaging.BundledJarSmoke'
}

tasks.named('check') {
    dependsOn tasks.named('verifyBundledJar'), tasks.named('smokeTestBundledJar')
}

// The generated wrapper will download this exact Gradle distribution and verify its checksum.
tasks.named('wrapper', Wrapper) {
    gradleVersion = '8.14.4'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d'
}
